[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpguard"
version = "0.1.0"
description = "Security scanner for MCP/AI agent configurations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro Lazzarin", email = "peedro.lazzarin@gmail.com" }]
homepage = "https://github.com/peedrolzz/mcpguard"
repository = "https://github.com/peedrolzz/mcpguard"
keywords = ["security", "mcp", "ai", "scanner", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
mcpguard = "mcpguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mcpguard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
